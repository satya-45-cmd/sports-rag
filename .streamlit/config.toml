# Custom color theme for the Sports Rules & Strategy Bot -- a dark,
# cinematic "night game under the floodlights" look: near-black background,
# a warm amber floodlight accent, and off-white text. The atmosphere (glow
# gradients, vignette, pill sport selector) and the Playfair Display/Inter
# fonts live in app.py's CSS block; this file only sets the colors
# Streamlit's own native widgets (buttons, selectbox, chat input, etc.) use.
# This file is safe to commit -- it's just colors, no secrets.
# Change any value here and restart `streamlit run app.py` to see it update.
# Full option list: https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[theme]
base = "dark"
primaryColor = "#FFB020"             # accent: buttons, selected items, focus rings (floodlight amber)
backgroundColor = "#06070A"          # main content background (near-black)
secondaryBackgroundColor = "#12151B" # sidebar / widget / card background (dark elevated panel)
textColor = "#F4F1EA"                # warm off-white, not pure white
font = "sans serif"
